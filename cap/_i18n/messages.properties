# Server messages. The keys are what the service sends, CAP localizes them per
# request locale. The PR0xx codes stay stable across languages and stacks.
NO_ITEMS=A requisition must contain at least one item.
QUANTITY_NOT_POSITIVE=Item {0}: enter a quantity greater than zero.
PRICE_NEGATIVE=Item {0}: the unit price must not be negative.
DELIVERY_DATE_IN_PAST=Item {0}: the delivery date must not be in the past.
SUPPLIER_BLOCKED=Item {0}: supplier {1} carries a purchasing block.
BUDGET_EXCEEDED=Cost center {0} has {1} left, the requisition asks for {2}.
TITLE_MISSING=Enter a title for the requisition.
COST_CENTER_MISSING=Assign a cost center before submitting.
SELF_APPROVAL=You cannot decide on a requisition you raised yourself.
NO_PENDING_STEP=The approval chain of this requisition is already complete.
MISSING_APPROVAL_ROLE=Approval level {0} requires the role {1}.
ACTION_NOT_ALLOWED=Action "{0}" is not allowed for a requisition in status {1}.
SUBMIT_ONLY_DRAFT=Only a requisition in status Draft can be submitted (current status: {0}).
WITHDRAW_NOT_ALLOWED=A requisition in status {0} cannot be withdrawn.
WITHDRAW_ALREADY_APPROVED=The requisition has already been approved on at least one level and can no longer be withdrawn.
REOPEN_ONLY_REJECTED=Only a rejected requisition can be reopened (current status: {0}).
REQUISITION_NOT_FOUND=Purchase requisition {0} does not exist.
SUPPLIER_NOT_FOUND=Supplier {0} does not exist.
ONLY_REQUESTER=Only the requester of this requisition can perform this action.
S4_PURCHASE_ORDER_FAILED=The purchase order could not be created in S/4HANA: {0}
UNKNOWN_RATING=Rating {0} is not a known financial rating.
S4_SUPPLIER_SYNC_FAILED=Suppliers could not be read from S/4HANA: {0}
DEMO_ONLY=Only available in the demo landscape.
S4_PURCHASE_ORDER_CREATED=Purchase order {0} created in S/4HANA.
RISK_REASSESSED=New risk score {0} (class {1}). Approval path adjusted for {2} open requisition(s).
S4_SUPPLIERS_SYNCED=S/4HANA: {0} new, {1} changed, {2} unchanged. Approval path adjusted for {3} open requisition(s).
MATRIX_EMPTY=The workbook contains no tiers below the header row.
MATRIX_NOT_A_NUMBER="{0}" is not an amount. Only the last row may be left open (no upper limit).
MATRIX_INVALID_LEVEL=Risk class {0}: "{1}" is not an approval level. Allowed are 1, 2 and 3.
MATRIX_NOT_ASCENDING=The value limits must rise from row to row ({0} does not).
MATRIX_LAST_TIER_NOT_OPEN=The last row must have no upper limit, or large requisitions would need no approval level at all.
MATRIX_RISKIER_IS_CHEAPER=A riskier supplier must never need fewer approval levels (A <= B <= C).
MATRIX_MORE_EXPENSIVE_IS_CHEAPER=Risk class {0}: a higher value must never need fewer approval levels than the row above.
MATRIX_FILE_UNREADABLE=The file could not be read as an Excel workbook (.xlsx, at most 512 KB).
MATRIX_ACTIVATED=Approval matrix with {0} tiers activated. It applies to drafts and new submissions; requisitions already in approval keep their path.
MATRIX_SHEET=Approval matrix
MATRIX_COLUMN_LIMIT=Net value up to (EUR, exclusive)
MATRIX_COLUMN_RISK=Level for risk class {0}
MATRIX_OPEN_ENDED=and above
