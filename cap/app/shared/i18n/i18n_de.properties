# Demo script
ScriptTitle=Demo-Drehbuch
ScriptLead=Zehn Schritte durch die Geschichte. Jeder Schritt meldet Sie als passenden Benutzer an und öffnet die passende Seite.
ScriptClose=Drehbuch schließen
ScriptGo=Öffnen
ScriptAsUser=als {0}
ScriptResetButton=Jetzt zurücksetzen
ScriptIntroTitle=Der Pitch in zwei Minuten
ScriptIntroText=Ausgangslage, Lösung und was sie wert ist - inklusive Rechner mit Ihren eigenen Zahlen.
ScriptSubmitTitle=Bedarf anfordern
ScriptSubmitText=Als Anforderin: Entwurf `Steel plates Q4 replenishment` öffnen und `Zur Genehmigung einreichen`. Wert und Lieferantenrisiko entscheiden, wer unterschreiben muss.
ScriptApprove1Title=Stufe 1 genehmigen
ScriptApprove1Text=Die Teamleitung sieht nur, was auf sie wartet, und genehmigt direkt in der Liste - ohne Dokumente zu öffnen.
ScriptDowngradeTitle=Ratingagentur stuft Lieferanten herab
ScriptDowngradeText=Als Einkaufsadministration: Rating von `Anadolu Endustri` auf `CC` setzen. Aus Risikoklasse B wird C - und der Genehmigungsweg jeder offenen Bestellanforderung wird sofort angepasst.
ScriptPathGrownTitle=Der Genehmigungsweg ist gewachsen
ScriptPathGrownText=Die Abteilungsleitung sieht die Hydraulik-Anforderung jetzt mit einer dritten Stufe. Genehmigen Sie sie - sie bleibt in Genehmigung, weil nun der CFO gebraucht wird.
ScriptCfoTitle=Der CFO unterschreibt
ScriptCfoText=Erst nach der dritten Stufe ist die Anforderung genehmigt. Der Verlauf zeigt jeden Schritt - auch den, den niemand geklickt hat.
ScriptOrderTitle=Bestellung in S/4HANA anlegen
ScriptOrderText=`In Bestellung umwandeln` ruft die Bestell-API von S/4HANA. Die Bestellnummer kommt zurück und steht an Kopf und Positionen.
ScriptSyncTitle=Lieferantenstammdaten aus S/4HANA
ScriptSyncText=`Aus S/4HANA synchronisieren` liest die Business-Partner-API: Ein Lieferant wurde dort gesperrt, einer umbenannt, einer ist neu - und ein offener Entwurf braucht sofort eine höhere Genehmigungsstufe.
ScriptCockpitTitle=Die Zahlen
ScriptCockpitText=Volumen in Genehmigung, Risikoexponierung, Budgetauslastung und was gerade passiert ist.
ScriptResetTitle=Von vorn beginnen
ScriptResetText=Stellt die Beispieldaten wieder her, damit die Geschichte erneut erzählt werden kann.

# For decision makers
SolutionHeroTitle=Genehmigungen, die das Lieferantenrisiko kennen - ohne Ihr S/4HANA zu verbiegen
SolutionHeroText=Bestellanforderungen werden nach Wert und Lieferantenrisiko freigegeben, die Stammdaten kommen aus S/4HANA, die Bestellung geht dorthin zurück. Erweiterung statt Modifikation: Ihr Kern bleibt updatefähig.
SolutionCtaDemo=Demo öffnen
SolutionCtaScript=Drehbuch anzeigen
SolutionPainTitle=Die Ausgangslage
SolutionPainLead=Was wir in Einkaufsorganisationen regelmäßig antreffen.
SolutionPain1Title=Freigaben per E-Mail
SolutionPain1Text=Wer was wann genehmigt hat, steht in Postfächern. Bei Rückfragen aus der Revision beginnt die Suche.
SolutionPain2Title=Risiko spielt keine Rolle
SolutionPain2Text=Ein Lieferant mit Zahlungsproblemen durchläuft denselben Genehmigungsweg wie ein zertifizierter Stammlieferant.
SolutionPain3Title=Wertgrenzen im Kopf
SolutionPain3Text=Die Grenzen stehen in einer Richtlinie, nicht im System. Jede Ausnahme ist Verhandlungssache.
SolutionPain4Title=Änderungen im ERP-Kern
SolutionPain4Text=Eigenentwicklungen direkt im ERP machen jedes Upgrade zum Projekt - genau das, was Clean Core verhindern soll.
SolutionBuildTitle=Die Lösung in drei Bausteinen
SolutionBuild1Title=Genehmigungsmatrix
SolutionBuild1Text=Wert × Risikoklasse ergibt die nötige Stufe (Teamleitung, Abteilungsleitung, CFO). Die Matrix ist eine Tabelle, die Ihr Einkaufsleiter liest und freigibt - kein Code-Kommentar.
SolutionBuild2Title=Lieferantenrisiko
SolutionBuild2Text=Ein Wert von 0 bis 100 aus Bonitätsrating, Länderrisiko, Liefertreue, Qualitätsmeldungen und Zertifizierung. Ändert er sich, ändert sich der Genehmigungsweg offener Anforderungen sofort.
SolutionBuild3Title=S/4HANA-Integration
SolutionBuild3Text=Lieferantenstammdaten kommen über die Business-Partner-API, die freigegebene Anforderung wird über die Bestell-API zur Bestellung. Freigegebene SAP-Schnittstellen, keine Z-Tabellen im Kern.
SolutionFlowTitle=So läuft es
SolutionFlow1Title=Anfordern
SolutionFlow1Text=Fachbereich erfasst den Bedarf, Preise und Werk kommen aus dem Materialstamm.
SolutionFlow2Title=Prüfen
SolutionFlow2Text=System prüft Budget, Liefersperren, Liefertermine - bevor jemand unterschreibt.
SolutionFlow3Title=Genehmigen
SolutionFlow3Text=Nur die Stufen, die Wert und Risiko wirklich verlangen. Niemand genehmigt sich selbst.
SolutionFlow4Title=Bestellen
SolutionFlow4Text=Bestellung entsteht in S/4HANA, die Nummer steht an der Anforderung.
SolutionFlow5Title=Nachweisen
SolutionFlow5Text=Lückenloser Verlauf je Beleg - inklusive automatischer Anpassungen des Genehmigungswegs.
SolutionBenefitTitle=Was das bringt
SolutionBenefit1Title=Kürzere Durchlaufzeiten
SolutionBenefit1Text=Genehmiger sehen eine Arbeitsvorratsliste statt eines Postfachs und entscheiden in der Liste. Die Dauer je Beleg misst das Cockpit mit.
SolutionBenefit2Title=Prüfsicherheit
SolutionBenefit2Text=Jeder Schritt steht am Beleg, mit Zeitpunkt, Person und Grund. Funktionstrennung ist als Regel implementiert, nicht als Absprache.
SolutionBenefit3Title=Risiko wirkt sofort
SolutionBenefit3Text=Eine Herabstufung erhöht die nötige Freigabestufe aller offenen Anforderungen - im laufenden Prozess, nicht erst beim nächsten Einreichen.
SolutionBenefit4Title=Updatefähiger Kern
SolutionBenefit4Text=Die Erweiterung läuft neben S/4HANA auf der SAP BTP. Ihr ERP behält Standardcode, das Upgrade bleibt ein Upgrade.
SolutionRoiTitle=Was es bei Ihnen bringt
SolutionRoiLead=Keine Branchendurchschnitte, keine Fantasiezahlen: Tragen Sie Ihre eigenen Annahmen ein - gerechnet wird nur die eingesparte Bearbeitungszeit.
SolutionRoiVolume=Bestellanforderungen pro Monat
SolutionRoiMinutes=Eingesparte Minuten je Anforderung
SolutionRoiRate=Interner Stundensatz (EUR)
SolutionRoiHours=Eingesparte Zeit pro Jahr
SolutionRoiHoursValue={0} Stunden
SolutionRoiMoney=Entspricht etwa
SolutionRoiFormula=Rechnung: {0} Anforderungen pro Jahr × {1} Minuten = {2} Stunden.
SolutionRoiNote=Bewusst konservativ: schneller gefundene Belege, vermiedene Fehlfreigaben und Risikokosten sind hier nicht eingerechnet.
SolutionCleanCoreTitle=On-Stack oder Side-by-Side?
SolutionCleanCoreLead=Beides ist in diesem Repository gebaut - hier die ehrliche Abgrenzung, wann was passt.
SolutionOnStack=On-Stack (ABAP Cloud / RAP)
SolutionSideBySide=Side-by-Side (SAP BTP / CAP)
SolutionCompareWhere=Wo es läuft
SolutionCompareWhereOnStack=Im S/4HANA-System selbst, freigegebene APIs statt Modifikation
SolutionCompareWhereSide=Auf der SAP BTP neben dem ERP, Anbindung über OData
SolutionCompareWhen=Wann sinnvoll
SolutionCompareWhenOnStack=Enge Kopplung an Belege und Tabellen, Massendaten, keine zusätzliche Plattform gewünscht
SolutionCompareWhenSide=Eigene Oberflächen, häufige Änderungen, Daten aus mehreren Systemen, unabhängiger Release-Zyklus
SolutionCompareSkills=Wer es pflegt
SolutionCompareSkillsOnStack=ABAP-Team mit ABAP-Cloud-Erfahrung
SolutionCompareSkillsSide=Node.js/TypeScript oder Java, plus CAP und Fiori
SolutionCompareRisk=Was es kostet
SolutionCompareRiskOnStack=Kein zusätzlicher Betrieb, aber jede Änderung folgt dem ERP-Releasezyklus
SolutionCompareRiskSide=Eigener Betrieb und Kosten auf der BTP, dafür unabhängig deploybar
SolutionPhasesTitle=Vorgehen
SolutionPhasesLead=Beispielhafter Ablauf - die konkreten Zeiten hängen von Systemzugang, Freigaben und Ihrem Regelwerk ab und werden im Workshop festgelegt.
SolutionPhase=Phase
SolutionDuration=Typische Dauer
SolutionContent=Inhalt
SolutionPhase1Title=Discovery-Workshop
SolutionPhase1Duration=2 bis 3 Tage
SolutionPhase1Text=Genehmigungsregeln, Risikofaktoren und Systemlandschaft aufnehmen; Entscheidung On-Stack oder Side-by-Side.
SolutionPhase2Title=Lauffähiger Prototyp
SolutionPhase2Duration=4 bis 6 Wochen
SolutionPhase2Text=Ihre Regeln, Ihre Stammdaten, Anbindung an ein Testsystem; Test mit echten Anforderern und Genehmigern.
SolutionPhase3Title=Pilot und Rollout
SolutionPhase3Duration=6 bis 10 Wochen
SolutionPhase3Text=Berechtigungen, Übernahme offener Vorgänge, Schulung, schrittweise Ausweitung auf weitere Einkaufsorganisationen.
SolutionPhase4Title=Betrieb und Ausbau
SolutionPhase4Duration=laufend
SolutionPhase4Text=Monitoring, Anpassung der Wertgrenzen, weitere Risikofaktoren, Anbindung weiterer Systeme.
SolutionContactTitle=Nächster Schritt
SolutionContactText=Sie können diese Demo mit Ihren eigenen Wertgrenzen und Risikofaktoren sehen. Schreiben Sie mir, dann bereite ich sie mit Ihren Zahlen vor.
SolutionContactName=Philipp Niestroj
SolutionContactMail=contact@philippniestroj.com

# Tour: new pages
TourShellScriptTitle=Demo-Drehbuch
TourShellScriptText=Zehn Schritte durch die komplette Geschichte - jeder Schritt meldet Sie als passenden Benutzer an und öffnet die passende Seite. Ideal, um die Demo selbst vorzuführen.
TourSolution1Title=Für Entscheider
TourSolution1Text=Diese Seite fasst zusammen, worum es fachlich geht: Ausgangslage, Lösung, Nutzen, Vorgehen - und die Abgrenzung On-Stack gegen Side-by-Side.
TourSolution2Title=Rechnen Sie selbst
TourSolution2Text=Tragen Sie Ihre eigenen Zahlen ein. Gerechnet wird nur die eingesparte Bearbeitungszeit, die Formel steht darunter.
TourCockpit1Title=Die vier Kennzahlen
TourCockpit1Text=Volumen in Genehmigung, genehmigt aber noch nicht bestellt, durchschnittliche Genehmigungsdauer und das offene Volumen bei Hochrisiko-Lieferanten.
TourCockpit2Title=Wo das Risiko liegt
TourCockpit2Text=Offenes Volumen je Lieferant, eingefärbt nach Risikoklasse. Genau diese Liste braucht der Category Manager nach einer Herabstufung.
TourCockpit3Title=Was gerade passiert ist
TourCockpit3Text=Die letzten Ereignisse aus allen Bestellanforderungen - inklusive automatisch angepasster Genehmigungswege.
TourInbox1Title=Meine Genehmigungen
TourInbox1Text=Ihr persönlicher Arbeitsvorrat: nur Bestellanforderungen, die auf genau Ihre Stufe warten. Eigene Anforderungen sind nie dabei - das prüft der Server, nicht die Oberfläche.
TourInbox2Title=Direkt entscheiden
TourInbox2Text=Genehmigen und Ablehnen stehen in der Zeile. Der Titel führt zur vollständigen Bestellanforderung, wenn Sie mehr Kontext brauchen.
TourInbox3Title=Rolle wechseln
TourInbox3Text=Im Benutzermenü wechseln Sie mit einem Klick zwischen den Demo-Benutzern und sehen sofort, wie sich der Arbeitsvorrat ändert.
TourReqDetail5Title=Verlauf
TourReqDetail5Text=Lückenlose Historie: eingereicht, genehmigt, abgelehnt, bestellt - und Anpassungen des Genehmigungswegs, die niemand geklickt hat, sondern eine Risikoänderung ausgelöst hat.
TourSupList5Title=S/4HANA und Ratings
TourSupList5Text=`Aus S/4HANA synchronisieren` holt Name, Land und Einkaufssperre über die Business-Partner-API. `Rating aktualisieren` simuliert den Feed der Ratingagentur - beides wirkt sofort auf offene Bestellanforderungen.
