# Tour: shell steps used on several pages
TourShellAppMenuTitle=App wechseln
TourShellAppMenuText=Klicken Sie auf den App-Titel, um zwischen Startseite und den beiden Apps zu wechseln. Das Logo links führt immer zur Startseite.
TourShellLanguageTitle=Deutsch oder Englisch
TourShellLanguageText=Hier wechseln Sie die Sprache. Dabei ändern sich nicht nur die Schaltflächen: Feldbezeichnungen, Statustexte und Fehlermeldungen liefert der Server in der gewählten Sprache.
TourShellThemeTitle=Hell oder dunkel
TourShellThemeText=Wechselt zwischen der hellen und dunklen Variante von SAP Horizon, dem aktuellen SAP-Fiori-Theme.
TourShellUserTitle=Wer bin ich?
TourShellUserText=Zeigt, als wer Sie angemeldet sind und welche Rollen Sie haben. Die Rollen entscheiden, was Sie dürfen - der Server prüft jede Anfrage, die Oberfläche blendet nur aus, was Sie nicht nutzen können.
TourShellRestartTitle=Das war's
TourShellRestartText=Mit dieser Schaltfläche starten Sie die Tour für die aktuelle Seite jederzeit neu.

# Tour: start page
TourHome1Title=Willkommen
TourHome1Text=Dieser Showcase bildet einen typischen SAP-Beschaffungsprozess ab: Bestellanforderungen brauchen bis zu drei Genehmigungen - abhängig von ihrem Wert und vom Risiko ihrer Lieferanten.\n\nDie Tour dauert etwa eine Minute.
TourHome2Title=Ihre Apps
TourHome2Text=Jede Kachel öffnet eine App. Die Zahlen kommen live aus dem OData-Service - wie viele Bestellanforderungen auf Genehmigung warten und wie viele Lieferanten ein hohes Risiko haben.
TourHome3Title=Was ist hier SAP?
TourHome3Text=Diese drei Karten trennen SAP-Technologie, offene Standards und den Code dieses Projekts. Lohnt sich, wenn Sie neu bei SAP sind.

# Tour: requisitions list
TourReqList1Title=Bestellanforderungen verwalten
TourReqList1Text=Hier erfassen Anforderer ihren Bedarf und reichen ihn ein; Genehmiger entscheiden darüber.\n\nDas ist ein SAP Fiori Elements List Report: Es gibt keinen handgeschriebenen UI-Code. Spalten, Filter, Farben und Schaltflächen werden aus CDS-Annotationen erzeugt.
TourReqList2Title=Filtern
TourReqList2Text=Filtern Sie nach Status, Lieferantenrisiko, Genehmigungsstufe, Anforderer oder Kostenstelle und klicken Sie auf `Start`. Unter `Standard` speichern Sie eine Filterkombination als eigene Sicht.
TourReqList3Title=Sichten nach Status
TourReqList3Text=Die Reiter teilen die Liste nach Bearbeitungsstand auf und zeigen, wie viele Bestellanforderungen jeweils darin liegen.
TourReqList4Title=Die Liste
TourReqList4Text=Status und Lieferantenrisiko sind farbig markiert. Die Farben berechnet der Server - die Oberfläche zeigt sie nur an.\n\nKlicken Sie auf eine Zeile, um die Bestellanforderung mit Positionen und Genehmigungskette zu öffnen.
TourReqList5Title=Neue Bestellanforderung
TourReqList5Text=Legt einen Entwurf an. SAP-Entwürfe werden schon beim Tippen auf dem Server gespeichert - nichts geht verloren, wenn Sie den Browser schließen.
TourReqListUsersTitle=Rollen ausprobieren
TourReqListUsersText=`rita` legt an, `tom` genehmigt Stufe 1, `dana` Stufe 2, `carl` Stufe 3 (CFO), `mona` pflegt Lieferanten. Niemand darf die eigene Bestellanforderung genehmigen.\n\nZum Benutzerwechsel ein privates Fenster öffnen.

# Tour: requisition object page
TourReqDetail1Title=Kennzahlen
TourReqDetail1Text=Nettowert, Status, Risikoklasse des Lieferanten und Genehmigungsfortschritt auf einen Blick.
TourReqDetail2Title=Aktionen
TourReqDetail2Text=Es erscheinen nur Aktionen, die im aktuellen Status erlaubt sind: einreichen, genehmigen, ablehnen, zurückziehen, überarbeiten. Ob Sie sie ausführen dürfen, prüft trotzdem der Server.
TourReqDetail3Title=Genehmigungskette
TourReqDetail3Text=Beim Einreichen legt der Server alle nötigen Genehmigungsschritte an. Wie viele es sind, hängt von Wert und Lieferantenrisiko ab - 27.150 EUR bei einem Hochrisiko-Lieferanten brauchen alle drei Stufen bis zum CFO.
TourReqDetail4Title=Positionen
TourReqDetail4Text=Ändern Sie Menge oder Preis: Nettowert, Risikoklasse und erforderliche Genehmigungsstufe werden sofort neu berechnet.

# Tour: suppliers list
TourSupList1Title=Lieferantenrisiko
TourSupList1Text=Jeder Lieferant bekommt einen Risikowert von 0 bis 100 - berechnet aus Bonitätsrating, Länderrisiko, Liefertreue, Qualitätsmeldungen und Zertifizierung.
TourSupList2Title=Filtern
TourSupList2Text=Zum Beispiel: nur Lieferanten mit hohem Risiko (Risikoklasse C) oder alle mit Einkaufssperre.
TourSupList3Title=Risiko auf einen Blick
TourSupList3Text=Der Balken wird ab einem Wert von 25 gelb und ab 55 rot - dieselben Grenzen, die das Bewertungsmodul nutzt. Ein gesperrter Lieferant hat immer 100.
TourSupList4Title=Risiko neu berechnen
TourSupList4Text=Lieferanten auswählen und den Wert neu berechnen. Das darf nur die Einkaufsadministration (`mona`); bei allen anderen lehnt der Server ab.

# Tour: supplier object page
TourSupDetail1Title=Wert und Klasse
TourSupDetail1Text=Risikowert, daraus folgende Risikoklasse und Liefertreue dieses Lieferanten.
TourSupDetail2Title=Risikoindikatoren
TourSupDetail2Text=Die Eingangsgrößen des Risikowerts. Ein schlechteres Rating erhöht die Genehmigungsstufe jeder offenen Bestellanforderung mit diesem Lieferanten.

