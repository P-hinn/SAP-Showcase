# Tour: new pages
TourShellScriptTitle=Demo script
TourShellScriptText=Ten steps through the whole story - each one signs you in as the right user and opens the right page. Made for presenting the demo yourself.
TourSolution1Title=For decision makers
TourSolution1Text=This page sums up the business side: situation, solution, benefits, approach - and the line between on-stack and side-by-side.
TourSolution2Title=Do the maths yourself
TourSolution2Text=Enter your own numbers. Only the saved processing time is calculated, and the formula is printed below.
TourCockpit1Title=The four key figures
TourCockpit1Text=Volume in approval, approved but not yet ordered, average approval time, and the open volume with high-risk suppliers.
TourCockpit2Title=Where the risk sits
TourCockpit2Text=Open volume per supplier, coloured by risk class. This is the list a category manager needs after a downgrade.
TourCockpit3Title=What just happened
TourCockpit3Text=The latest events across all requisitions - including approval paths that were adjusted automatically.
TourInbox1Title=My approvals
TourInbox1Text=Your personal worklist: only requisitions waiting for exactly your level. Your own requisitions never appear - checked by the server, not by the UI.
TourInbox2Title=Decide right here
TourInbox2Text=Approve and reject sit in the row. The title opens the full requisition when you need more context.
TourInbox3Title=Switch role
TourInbox3Text=The user menu switches between the demo users with one click, and the worklist changes with it.
TourReqDetail5Title=History
TourReqDetail5Text=The complete trail: submitted, approved, rejected, ordered - plus adjustments of the approval path that nobody clicked but a risk change triggered.
TourSupList5Title=S/4HANA and ratings
TourSupList5Text=`Sync from S/4HANA` takes name, country and purchasing block from the Business Partner API. `Update rating` simulates the rating agency feed - both take effect on open requisitions immediately.

