# Tour: shell steps used on several pages
TourShellAppMenuTitle=Switch apps
TourShellAppMenuText=Click the app title to switch between the start page and the two apps. The logo on the left always takes you home.
TourShellLanguageTitle=Deutsch or English
TourShellLanguageText=Switch the language here. It is not only the buttons that change: field labels, status texts and error messages come from the server in the chosen language.
TourShellThemeTitle=Light or dark
TourShellThemeText=Switches between the light and dark variant of SAP Horizon, the current SAP Fiori theme.
TourShellUserTitle=Who am I?
TourShellUserText=Shows the user you are signed in as and your roles. Roles decide what you may do - the server checks every request, the UI only hides what you cannot use.
TourShellRestartTitle=That's it
TourShellRestartText=You can restart the tour for the page you are on at any time with this button.

# Tour: start page
TourHome1Title=Welcome
TourHome1Text=This showcase implements a typical SAP procurement process: purchase requisitions need up to three approvals, depending on their value and the risk of their suppliers.\n\nThe tour takes about a minute.
TourHome2Title=Your apps
TourHome2Text=Each tile opens an app. The numbers are live from the OData service - how many requisitions are waiting for approval, and how many suppliers are high risk.
TourHome3Title=What is SAP here?
TourHome3Text=These three cards separate SAP technology, open standards and the code written for this project. Worth a look if you are new to SAP.

# Tour: requisitions list
TourReqList1Title=Manage purchase requisitions
TourReqList1Text=Requesters raise their demand here and submit it; approvers decide on it.\n\nThis is an SAP Fiori Elements list report: there is no hand-written UI code. Columns, filters, colours and buttons are generated from CDS annotations.
TourReqList2Title=Filter
TourReqList2Text=Filter by status, supplier risk, approval level, requester or cost center, then press `Go`. Under `Standard` you can save a filter combination as your own view.
TourReqList3Title=Views by status
TourReqList3Text=The tabs split the list by lifecycle stage and show how many requisitions are in each.
TourReqList4Title=The list
TourReqList4Text=Status and supplier risk are colour coded. The colours are computed on the server - the UI just shows them.\n\nClick a row to open the requisition with its items and approval chain.
TourReqList5Title=New requisition
TourReqList5Text=Creates a draft. SAP drafts are saved on the server while you type, so nothing is lost if you close the browser.
TourReqListUsersTitle=Try the roles
TourReqListUsersText=`rita` creates, `tom` approves level 1, `dana` level 2, `carl` level 3 (CFO), `mona` administers suppliers. Nobody may approve their own requisition.\n\nTo switch users, open a private window.

# Tour: requisition object page
TourReqDetail1Title=Key figures
TourReqDetail1Text=Net value, status, supplier risk class and approval progress at a glance.
TourReqDetail2Title=Actions
TourReqDetail2Text=Only actions allowed in the current status appear: submit, approve, reject, withdraw, rework. Whether you may run them is still checked by the server.
TourReqDetail3Title=Approval chain
TourReqDetail3Text=On submit the server creates every approval step that is needed. How many depends on value and supplier risk - 27,150 EUR with a high-risk supplier needs all three levels up to the CFO.
TourReqDetail4Title=Items
TourReqDetail4Text=Edit quantity or price and the net value, risk class and required approval level are recalculated right away.

# Tour: suppliers list
TourSupList1Title=Supplier risk
TourSupList1Text=Every supplier gets a risk score from 0 to 100, computed from financial rating, country risk, on-time delivery, quality incidents and certification.
TourSupList2Title=Filter
TourSupList2Text=For example: only high-risk suppliers (risk class C), or all suppliers with a purchasing block.
TourSupList3Title=Risk at a glance
TourSupList3Text=The bar turns yellow from a score of 25 and red from 55 - the same thresholds the scoring module uses. A blocked supplier always scores 100.
TourSupList4Title=Recalculate risk
TourSupList4Text=Select a supplier and recalculate its score. Only the procurement admin (`mona`) may do this; for everybody else the server refuses.

# Tour: supplier object page
TourSupDetail1Title=Score and class
TourSupDetail1Text=The score, the resulting risk class and the on-time delivery rate of this supplier.
TourSupDetail2Title=Risk indicators
TourSupDetail2Text=The inputs of the score. A worse rating raises the approval level of every open requisition that uses this supplier.

