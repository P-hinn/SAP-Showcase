ScriptIntroTitle=The pitch in two minutes
ScriptIntroText=Situation, solution and what it is worth - plus a calculator with your own numbers.
ScriptSubmitTitle=Raise demand
ScriptSubmitText=As the requester: open the draft `Steel plates Q4 replenishment` and press `Submit for approval`. Value and supplier risk decide who has to sign.
ScriptApprove1Title=Approve level 1
ScriptApprove1Text=The team lead sees only what is waiting for them and approves right in the list - no opening of documents.
ScriptDowngradeTitle=Rating agency downgrades a supplier
ScriptDowngradeText=As the procurement admin: set the rating of `Anadolu Endustri` to `CC`. Risk class B becomes C - and the approval path of every open requisition is adjusted immediately.
ScriptPathGrownTitle=The approval path grew
ScriptPathGrownText=The department head now sees the hydraulics requisition with a third level. Approve it - it stays in approval, because the CFO is needed now.
ScriptCfoTitle=CFO signs
ScriptCfoText=Only after the third level the requisition is approved. The history shows every step, including the one nobody clicked.
ScriptOrderTitle=Create the purchase order in S/4HANA
ScriptOrderText=`Create purchase order` calls the S/4HANA purchase order API. The order number comes back and is stored on the requisition and its items.
ScriptSyncTitle=Supplier master data from S/4HANA
ScriptSyncText=`Sync from S/4HANA` reads the Business Partner API: a supplier was blocked there, one was renamed, one is new - and an open draft immediately needs a higher approval level.
ScriptCockpitTitle=The numbers
ScriptCockpitText=Volume in approval, risk exposure, budget utilisation and what just happened.
ScriptResetTitle=Start over
ScriptResetText=Restores the sample data, so the story can be told again.

# For decision makers
SolutionHeroTitle=Approvals that know the supplier risk - without bending your S/4HANA
SolutionHeroText=Purchase requisitions are approved by value and supplier risk, master data comes from S/4HANA, the purchase order goes back there. Extension instead of modification: your core stays upgradable.
SolutionCtaDemo=Open the demo
SolutionCtaScript=Show the script
SolutionPainTitle=The situation
SolutionPainLead=What we regularly find in procurement organisations.
SolutionPain1Title=Approvals by email
SolutionPain1Text=Who approved what and when lives in mailboxes. When audit asks, the search begins.
SolutionPain2Title=Risk plays no part
SolutionPain2Text=A supplier with payment problems runs through the same approval path as a certified long-term partner.
SolutionPain3Title=Thresholds by heart
SolutionPain3Text=The limits are in a policy, not in the system. Every exception is a negotiation.
SolutionPain4Title=Changes in the ERP core
SolutionPain4Text=Custom code inside the ERP turns every upgrade into a project - exactly what clean core is meant to prevent.
SolutionBuildTitle=The solution in three parts
SolutionBuild1Title=Approval matrix
SolutionBuild1Text=Value x risk class gives the required level (team lead, department head, CFO). The matrix is a table your procurement lead reads and signs off - not a code comment.
SolutionBuild2Title=Supplier risk
SolutionBuild2Text=A score from 0 to 100 from financial rating, country risk, on-time delivery, quality incidents and certification. When it changes, the approval path of open requisitions changes with it.
SolutionBuild3Title=S/4HANA integration
SolutionBuild3Text=Supplier master data comes through the Business Partner API, the approved requisition becomes a purchase order through the Purchase Order API. Released SAP interfaces, no custom tables in the core.
SolutionFlowTitle=How it runs
SolutionFlow1Title=Request
SolutionFlow1Text=The department raises the demand; prices and plant come from the material master.
SolutionFlow2Title=Check
SolutionFlow2Text=The system checks budget, purchasing blocks and delivery dates - before anybody signs.
SolutionFlow3Title=Approve
SolutionFlow3Text=Only the levels that value and risk actually require. Nobody approves their own demand.
SolutionFlow4Title=Order
SolutionFlow4Text=The purchase order is created in S/4HANA; its number sits on the requisition.
SolutionFlow5Title=Prove
SolutionFlow5Text=A complete history per document - including automatic adjustments of the approval path.
SolutionBenefitTitle=What it is worth
SolutionBenefit1Title=Shorter lead times
SolutionBenefit1Text=Approvers get a worklist instead of an inbox and decide in the list. The cockpit measures the duration per document.
SolutionBenefit2Title=Audit safety
SolutionBenefit2Text=Every step sits on the document with time, person and reason. Segregation of duties is implemented as a rule, not agreed upon.
SolutionBenefit3Title=Risk takes effect immediately
SolutionBenefit3Text=A downgrade raises the required approval level of all open requisitions - during the running process, not at the next submission.
SolutionBenefit4Title=An upgradable core
SolutionBenefit4Text=The extension runs next to S/4HANA on SAP BTP. Your ERP keeps standard code, an upgrade stays an upgrade.
SolutionRoiTitle=What it is worth for you
SolutionRoiLead=No industry averages, no invented numbers: enter your own assumptions - only the saved processing time is calculated.
SolutionRoiVolume=Purchase requisitions per month
SolutionRoiMinutes=Minutes saved per requisition
SolutionRoiRate=Internal hourly rate (EUR)
SolutionRoiHours=Time saved per year
SolutionRoiHoursValue={0} hours
SolutionRoiMoney=Roughly equals
SolutionRoiFormula=Calculation: {0} requisitions per year x {1} minutes = {2} hours.
SolutionRoiNote=Deliberately conservative: documents found faster, wrong approvals avoided and risk cost are not part of this.
SolutionCleanCoreTitle=On-stack or side-by-side?
SolutionCleanCoreLead=Both are built in this repository - here is the honest line between them.
SolutionOnStack=On-stack (ABAP Cloud / RAP)
SolutionSideBySide=Side-by-side (SAP BTP / CAP)
