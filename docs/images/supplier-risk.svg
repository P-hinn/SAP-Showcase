<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img"
     aria-label="Schematic of the supplier risk list report">
  <style>
    .f { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 12px; font-weight: 600; fill: #556B82; }
    .c { font-size: 13px; fill: #1D2D3E; }
    .m { font-size: 13px; fill: #556B82; }
    .n { font-size: 13px; fill: #1D2D3E; text-anchor: end; }
    .t { font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    .lbl { font-size: 11px; fill: #556B82; }
    .btn { font-size: 12px; font-weight: 600; fill: #0070F2; }
  </style>

  <rect width="960" height="300" fill="#F5F6F7"/>
  <rect width="960" height="44" fill="#354A5F"/>
  <text class="f t" x="20" y="28">Supplier Risk</text>

  <rect x="16" y="60" width="928" height="196" rx="8" fill="#FFFFFF" stroke="#D9DEE3"/>
  <text class="f" x="32" y="84" font-size="14" font-weight="600" fill="#1D2D3E">Suppliers (4 of 8)</text>
  <text class="f btn" x="928" y="84" text-anchor="end">Recalculate Risk</text>
  <line x1="16" y1="96" x2="944" y2="96" stroke="#D9DEE3"/>

  <text class="f h" x="32" y="114">Supplier</text>
  <text class="f h" x="110" y="114">Name</text>
  <text class="f h" x="350" y="114">Country</text>
  <text class="f h" x="420" y="114">Rating</text>
  <text class="f h" x="490" y="114">On Time</text>
  <text class="f h" x="580" y="114">Risk Score</text>
  <text class="f h" x="790" y="114">Class</text>
  <text class="f h" x="860" y="114">Blocked</text>
  <line x1="16" y1="122" x2="944" y2="122" stroke="#D9DEE3"/>

  <!-- rows -->
  <text class="f c" x="32" y="146">4711001</text>
  <text class="f c" x="110" y="146">Nordwind Stahl GmbH</text>
  <text class="f m" x="350" y="146">DE</text>
  <text class="f m" x="420" y="146">AAA</text>
  <text class="f m" x="490" y="146">98 %</text>
  <rect x="580" y="139" width="160" height="8" rx="4" fill="#EAECEE"/>
  <rect x="580" y="139" width="2" height="8" rx="1" fill="#36A41D"/>
  <text class="f c" x="748" y="146">1</text>
  <text class="f" x="790" y="146" font-size="13" font-weight="600" fill="#256F3A">A</text>
  <text class="f m" x="860" y="146">No</text>
  <line x1="16" y1="158" x2="944" y2="158" stroke="#EAECEE"/>

  <text class="f c" x="32" y="180">4711005</text>
  <text class="f c" x="110" y="180">Anadolu Endustri A.S.</text>
  <text class="f m" x="350" y="180">TR</text>
  <text class="f m" x="420" y="180">BB</text>
  <text class="f m" x="490" y="180">84 %</text>
  <rect x="580" y="173" width="160" height="8" rx="4" fill="#EAECEE"/>
  <rect x="580" y="173" width="64" height="8" rx="4" fill="#E76500"/>
  <text class="f c" x="748" y="180">40</text>
  <text class="f" x="790" y="180" font-size="13" font-weight="600" fill="#E76500">B</text>
  <text class="f m" x="860" y="180">No</text>
  <line x1="16" y1="192" x2="944" y2="192" stroke="#EAECEE"/>

  <text class="f c" x="32" y="214">4711006</text>
  <text class="f c" x="110" y="214">Shenzhen Ruiyang Electronics Co.</text>
  <text class="f m" x="350" y="214">CN</text>
  <text class="f m" x="420" y="214">CCC</text>
  <text class="f m" x="490" y="214">70 %</text>
  <rect x="580" y="207" width="160" height="8" rx="4" fill="#EAECEE"/>
  <rect x="580" y="207" width="99" height="8" rx="4" fill="#BB0000"/>
  <text class="f c" x="748" y="214">62</text>
  <text class="f" x="790" y="214" font-size="13" font-weight="600" fill="#BB0000">C</text>
  <text class="f m" x="860" y="214">No</text>
  <line x1="16" y1="226" x2="944" y2="226" stroke="#EAECEE"/>

  <text class="f c" x="32" y="248">4711008</text>
  <text class="f c" x="110" y="248">Kontinental Zulieferer GmbH</text>
  <text class="f m" x="350" y="248">DE</text>
  <text class="f m" x="420" y="248">CCC</text>
  <text class="f m" x="490" y="248">62 %</text>
  <rect x="580" y="241" width="160" height="8" rx="4" fill="#EAECEE"/>
  <rect x="580" y="241" width="160" height="8" rx="4" fill="#BB0000"/>
  <text class="f c" x="748" y="248">100</text>
  <text class="f" x="790" y="248" font-size="13" font-weight="600" fill="#BB0000">C</text>
  <text class="f" x="860" y="248" font-size="13" font-weight="600" fill="#BB0000">Yes</text>

  <text class="f lbl" x="16" y="278">The gauge turns yellow at 25 and red at 55 — the same thresholds the scoring module uses. A purchasing block forces 100 and class C outright.</text>
</svg>
